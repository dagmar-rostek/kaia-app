<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:96px}

a{color:var(--blue-d)}
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,252,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}

.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px}

.hero{border-radius:28px;padding:34px 30px;background:linear-gradient(135deg,var(--blue) 0%,#9bb0f3 55%,var(--blue-l) 100%);color:#fff;position:relative;overflow:hidden;margin-bottom:26px}

.hero::before{content:"";position:absolute;right:90px;bottom:-70px;width:150px;height:150px;background:var(--yel);transform:rotate(18deg);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hero>*{position:relative;z-index:1;max-width:620px}

h2{font-size:24px;line-height:1.2;margin:0 0 6px}

.src{font-size:12.5px;color:var(--mut);margin-top:10px}
.card p{margin:8px 0}
.card ul{margin:6px 0 10px;padding-left:22px}
.card li{margin:3px 0}
blockquote{margin:10px 0;padding:10px 14px;border-left:4px solid var(--yel);background:var(--yel-l);border-radius:0 10px 10px 0;font-style:italic}
table.tb{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}

.amp td:first-child{font-weight:700;width:90px}
.amp tr.r td:first-child{background:#f6c9c9}.amp tr.g td:first-child{background:#f6ef9e}.amp tr.n td:first-child{background:#c7e8c3}
.fld{margin:16px 0 4px}
.q{display:block;font-weight:600;margin:0 0 6px;line-height:1.4}
.q small{display:block;font-weight:400;color:var(--mut)}
textarea,input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--blue-xl);transition:border-color .2s,background .2s}

.tarea{position:relative}
.dict{position:absolute;right:8px;bottom:10px;border:0;background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--blue-d);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.dict.on{background:var(--mag);color:#fff}
.lst input{margin-bottom:6px}
.scale{display:flex;flex-wrap:wrap;gap:5px}
.scale button{min-width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600}

.scale.opts button{min-width:0;height:auto;padding:8px 12px;text-align:left;font-weight:500}

.item:first-of-type{border-top:0}
.item .t{font-size:15.5px}
.item .t b{color:var(--mag);margin-right:4px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

.cgroup{margin:6px 0}
.cgroup b{display:inline-block;min-width:110px;font-size:14px;color:var(--mut)}
.grid2{display:grid;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.res{margin:14px 0 4px;padding:14px 16px;border-radius:14px;background:var(--blue-xl);border:1px solid var(--line)}
.res h4{margin:0 0 8px;color:var(--ink)}

.bar span:last-child{text-align:right;font-weight:700}

.img{width:100%;border-radius:14px;border:1px solid var(--line);display:block;margin:10px 0}

.pbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--blue);border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--blue-d);background:var(--blue-xl)}

.ghost{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 18px;cursor:pointer}
.danger{background:#b3261e;color:#fff;border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;margin:8px 0}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--mag)}
.howto{font-size:14.5px;color:var(--mut);background:var(--yel-l);border-radius:12px;padding:10px 14px}
.howto p{margin:4px 0}
.confirm{border:1px solid #f0c4c1;background:#fdf1f0;border-radius:12px;padding:10px 14px}
.qlist{font-size:14px;line-height:1.5}

.qlist p{margin:5px 0;word-break:break-word}
.sig{font-size:13.5px;color:var(--mut);line-height:1.55}
footer{max-width:980px;margin:0 auto;padding:10px 18px 30px;font-size:13px;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.nav button{border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:16px}
#prev{background:var(--blue-l);color:var(--blue-d)}
#next{background:var(--ink);color:#fff;margin-left:auto}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.on{opacity:.95}
@media(max-width:600px){
  body{font-size:16px}
  .hero{padding:26px 20px;border-radius:22px}
  .hero::after{width:130px;height:130px;right:-55px;top:-55px}
  .hero::before{width:90px;height:90px;right:20px;bottom:-50px}
  .card{padding:18px 15px}
  .bar{grid-template-columns:110px 1fr 44px}
}
@media print{
  .top,.nav,.dict,.pbtn,.actions,.howto,.toast{display:none!important}
  body{background:#fff;padding:0}
  .card{break-inside:avoid;box-shadow:none}
}
</style>

function chapterFilled(ch){var ids=[];ch.blocks.forEach(function(b){if(b.t==='ex')collectIds(b).forEach(function(i){ids.push(i);});});var n=ids.filter(function(i){return filled(i);}).length;return [n,ids.length];}
function filled(id){var v=state.f[id];return v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length);}
function collectIds(b){var ids=[];b.fields.forEach(function(f){
  if(['txt','inp','sc','opt','rng','chips'].indexOf(f.f)>-1)ids.push(f.id);
  else if(f.f==='lst'){for(var i=0;i<f.n;i++)ids.push(f.id+'_'+i);}
  else if(f.f==='w'){if(f.k==='rf')RF.forEach(function(g,gi){for(var i=0;i<3;i++)ids.push('rf_'+gi+'_'+i);});
   if(f.k==='sr')SR.forEach(function(_,i){ids.push('sr_'+i);});
   if(f.k==='antr')AQ.forEach(function(_,i){ids.push('an_'+(i+1));});}
 });return ids;}
function renderProgress(){document.getElementById('progress').innerHTML=CH.map(function(c,i){var p=chapterFilled(c);return '<button type="button" data-go="'+i+'" class="'+(i===state.step?'on':'')+(p[0]>0?' done':'')+'">'+(i?i+' · ':'')+c.nav+'</button>';}).join('');
 var on=document.querySelector('.progress .on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
function render(){
 var ch=CH[state.step];var h='<section class="hero"><p class="kicker">'+ch.kicker+'</p><h1>'+ch.title+'</h1><p class="lead">'+ch.lead+'</p></section>';
 ch.blocks.forEach(function(b){
  if(b.t==='th')h+='<article class="card th"><span class="tag th">Theorie</span><h2>'+b.h+'</h2>'+b.b.map(node).join('')+'</article>';
  else if(b.t==='ex')h+='<article class="card ex"><span class="tag ex">'+(b.src?'Arbeitsblatt':'Übung')+'</span><h2>'+b.h+'</h2>'+(b.meta?'<div class="meta">'+b.meta.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div>':'')+(b.intro?'<p>'+b.intro+'</p>':'')+b.fields.map(field).join('')+(b.src?'<p class="src">'+b.src+'</p>':'')+'</article>';
  else if(b.t==='end')h+=endHTML();
 });
 main.innerHTML=h;renderProgress();updateCalcs();
 var ph=main.querySelectorAll('[data-thumbs]');for(var i=0;i<ph.length;i++)loadThumbs(ph[i].getAttribute('data-thumbs'));
 document.getElementById('prev').style.visibility=state.step===0?'hidden':'visible';
 var nx=document.getElementById('next');nx.style.visibility=state.step===CH.length-1?'hidden':'visible';nx.textContent=state.step===CH.length-2?'Zum PDF':'Weiter';
}
function endHTML(){
 var h='<article class="card"><h2>Dein Stand</h2>';
 CH.forEach(function(c,i){if(i===CH.length-1)return;var p=chapterFilled(c);if(!p[1])return;h+='<div class="sum-ch"><a data-go="'+i+'">'+c.nav+'</a><span class="pill">'+p[0]+' von '+p[1]+'</span></div>';});
 h+='</article><article class="card ex"><span class="tag ex">PDF</span><h2>Playbook als PDF speichern</h2>'+
 '<label class="check"><input type="checkbox" id="withTheory"'+(state.theory?' checked':'')+'> Theorie mit aufnehmen</label>'+
 '<div class="actions"><button class="primary" type="button" id="pdf">PDF herunterladen</button></div>'+
 '<div class="howto"><p><b>Falls kein Download startet:</b> Druckfenster öffnet sich → „Als PDF speichern".</p></div>'+
 '<div class="actions"><button class="ghost" type="button" id="reset">Alle Einträge löschen</button></div><div class="confirm" id="confirm" hidden><p>Alle Texte und Fotos löschen?</p><button class="danger" type="button" id="reset-yes">Ja, löschen</button> <button class="ghost" type="button" id="reset-no">Abbrechen</button></div>'+
 '</article><article class="card"><p class="sig">'+SIG+'</p></article>';
 return h;}

function loadThumbs(id){var box=main.querySelector('[data-thumbs="'+id+'"]');if(!box)return;DB.get(id).then(function(l){box.innerHTML=l.map(function(p,i){return '<figure><img src="'+p.d+'" alt="Foto '+(i+1)+'"><button type="button" data-del="'+id+'" data-i="'+i+'">✕</button></figure>';}).join('');});}

var SR_API2=window.SpeechRecognition||window.webkitSpeechRecognition;var rec=null,recBtn=null;
function toggleDictate(btn){var id=btn.getAttribute('data-dict');if(rec){try{rec.stop();}catch(e){}return;}
 var ta=document.getElementById(id);if(!ta)return;rec=new SR_API2();rec.lang='de-DE';rec.continuous=true;rec.interimResults=false;recBtn=btn;
 rec.onresult=function(ev){for(var i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal){var t=ev.results[i][0].transcript.trim();ta.value=ta.value?(ta.value.replace(/\s+$/,'')+' '+t):t;ta.dispatchEvent(new Event('input',{bubbles:true}));}}};
 rec.onend=function(){if(recBtn){recBtn.classList.remove('on');recBtn.textContent='Diktieren';}rec=null;recBtn=null;};rec.onerror=function(){};
 try{rec.start();btn.classList.add('on');btn.textContent='Stopp';}catch(e){rec=null;}}

function makePDF(btn){
 if(!window.jspdf||!window.jspdf.jsPDF){window.print();return;}
 btn.disabled=true;btn.textContent='PDF wird erstellt …';
 var withT=state.theory;
 DB.get('rb_foto').then(function(photos){
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var W=210,H=297,M=18,y=M,BL=[74,99,201],MG=[163,35,108],INK=[29,33,64],MUT=[90,95,128];
  function ensure(h){if(y+h>H-M){doc.addPage();y=M;}}
  function t(s,size,style,col,gap,indent){s=String(s==null?'':s).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/[„""]/g,'"').replace(/[–—]/g,'-').replace(/[^\x00-\xFF\n]/g,'').replace(/[ \t]+/g,' ').trim();if(!s){y+=gap||0;return;}indent=indent||0;doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(col[0],col[1],col[2]);var lines=doc.splitTextToSize(s,W-2*M-indent),lh=size*0.3528*1.42;lines.forEach(function(l){ensure(lh);doc.text(l,M+indent,y+lh*0.78);y+=lh;});y+=gap||0;}
  function answer(v){if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length)){t('-',10.5,'italic',MUT,2.5,3);return;}t(Array.isArray(v)?v.join(', '):String(v),10.5,'normal',INK,2.8,3);}
  function pNode(n){
   if(typeof n==='string'){t(n,10.5,'normal',INK,2);return;}
   if(Array.isArray(n)){n.forEach(function(x){t('- '+x,10,'normal',INK,0.6,3);});y+=1.5;return;}
   if(n.q){t('"'+n.q+'"',10.5,'italic',INK,2,3);return;}
   if(n.h!==undefined){t(n.h,11,'bold',MG,1);if(n.l){n.l.forEach(function(x){t('- '+x,10,'normal',INK,0.6,3);});y+=1.5;}return;}
   if(n.tbl){n.tbl.slice(1).forEach(function(r){t(r.filter(Boolean).join(' - '),10,'normal',INK,1.2,3);});y+=1.5;return;}
   if(n.sig){t(SIG,9.5,'normal',MUT,2);return;}
  }
  function pField(f){
   switch(f.f){
   case 'txt':case 'inp':t((f.q||'').replace(/<[^>]+>/g,' '),10.5,'bold',INK,0.6);answer(V(f.id));break;
   case 'lst':t(f.q,10.5,'bold',INK,0.6);for(var i=0;i<f.n;i++){var v=V(f.id+'_'+i);if(v)t((i+1)+'. '+v,10.5,'normal',INK,0.8,3);}y+=2;break;
   case 'info':if(withT)f.b.forEach(pNode);break;
   case 'opt':t(f.q,10.5,'bold',INK,0.6);answer(V(f.id)!=null?f.o[V(f.id)]:'');break;
   case 'rng':t(f.q,10.5,'bold',INK,0.6);answer(num(f.id)!=null?num(f.id)+(f.u||''):'');break;
   case 'chips':t((f.q||'').replace(/<[^>]+>/g,' '),10.5,'bold',INK,0.6);answer(V(f.id)||[]);break;
   case 'photo':t(f.q,10.5,'bold',INK,0.6);photos.forEach(function(p){var iw=W-2*M,ih=iw*p.h/p.w;if(ih>200){ih=200;iw=ih*p.w/p.h;}ensure(ih+3);try{doc.addImage(p.d,'JPEG',M,y,iw,ih);}catch(e){}y+=ih+3;});break;
   case 'w':pWidget(f.k);break;
   }
  }
  function pWidget(k){
   if(k==='rf')RF.forEach(function(g,gi){t(g[0],11,'bold',MG,0.8);g[1].forEach(function(q,i){var v=num('rf_'+gi+'_'+i);t((v==null?'-':v)+'  '+q,10,'normal',INK,0.8,3);});y+=1;});
   else if(k==='rfres'){rfSums().forEach(function(x){t(x.n+': '+x.s+' Punkte',10,'normal',INK,1.2,3);});}
   else if(k==='sr'){var s=0;SR.forEach(function(q,i){var v=num('sr_'+i);if(v!=null)s+=v;t((i+1)+'. ['+(v==null?'-':v)+'] '+q,9.5,'normal',INK,0.5,3);});t('Summe: '+s+' von '+SR.length*5,10.5,'bold',BL,2.5);}
   else if(k==='antr'){AQ.forEach(function(q,i){var v=num('an_'+(i+1));t((i+1)+'. ['+(v==null?'-':v)+'] '+q,9.5,'normal',INK,0.5,3);});y+=2;}
   else if(k==='antrres'){antrSums().forEach(function(x){t(x.n+': '+x.s+' Punkte',10,'normal',INK,1.2,3);});}
   else if(k==='steck'){if(withT)STECK.forEach(function(s){t(s.n,11,'bold',MG,0.8);t(s.i,10,'normal',INK,1);y+=2;});}
   else if(k==='matrix'){for(var i=0;i<10;i++){var n=V('mx_n'+i);if(!n)continue;var H2=num('mx_h'+i),W2=num('mx_w'+i),Q2=num('mx_q'+i);t(n+': '+(H2||'-')+', '+(W2||'-')+', '+(Q2||'-')+' -> '+((H2!=null&&W2!=null&&Q2!=null)?(H2+W2)*Q2:'-'),10,'normal',INK,0.8,3);}}
   else if(k==='radar'){['Familie','Freunde','Beruf','Virtuelle Kontakte'].forEach(function(q,qi){t(q,10.5,'bold',MG,0.6);for(var i=0;i<5;i++){var b='rd_'+qi+'_'+i,n=V(b+'_n');if(n)t(n+(V(b+'_d')?' ('+V(b+'_d')+')':('')),10,'normal',INK,0.8,3);}});}
   else if(k==='torte'){var tot=0;for(var i=0;i<8;i++){var hh=num('to_h'+i);if(hh){tot+=hh;t((V('to_n'+i)||'Bereich '+(i+1))+': '+hh+' h',10,'normal',INK,0.8,3);}}if(tot)t('Summe: '+tot+' h',10,'italic',MUT,2,3);}
   else if(k==='akku'){var p=num('akku_p');if(p!=null)t('Akkustand: '+p+' %',10.5,'bold',INK,2);}
   else if(k==='lebensrad'){}
  }
  // Deckblatt
  var name=(V('name')||'').trim(),datum=(V('datum')||'').trim()||new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});
  doc.setFillColor(124,151,238);doc.rect(0,0,W,120,'F');doc.setFillColor(MG[0],MG[1],MG[2]);doc.circle(W-20,18,38,'F');doc.setFillColor(242,232,90);doc.triangle(140,120,170,72,200,120,'F');
  y=60;t('MEIN PLAYBOOK',11,'bold',[255,255,255],3);t('Kommunikation trifft Resilienz',28,'bold',[255,255,255],2);t('Stärke deine Widerstandskraft und fördere Teamarbeit',13,'normal',[255,255,255],0);
  y=140;if(name)t(name,16,'bold',INK,2);t(datum,12,'normal',MUT,0);
  y=H-M-14;t(SIG,9,'normal',MUT,0);
  // Kapitel
  CH.forEach(function(ch,ci){if(ci===0||ch.id==='ende')return;
   doc.addPage();y=M;t(ch.kicker.toUpperCase(),9,'bold',MG,1);t(ch.title,20,'bold',INK,2);doc.setDrawColor(BL[0],BL[1],BL[2]);doc.setLineWidth(0.6);doc.line(M,y,W-M,y);y+=4;
   ch.blocks.forEach(function(b){
    if(b.t==='th'){if(!withT)return;ensure(14);t('THEORIE',8,'bold',BL,0.5);t(b.h,13,'bold',INK,1.5);b.b.forEach(pNode);y+=3;}
    else if(b.t==='ex'){ensure(16);t((b.src?'ARBEITSBLATT':'ÜBUNG')+(b.meta?'  –  '+b.meta.join(' · '):''),8,'bold',MG,0.5);t(b.h,13,'bold',INK,1.5);if(b.intro&&withT)t(b.intro,10,'italic',MUT,2);b.fields.forEach(pField);if(b.src&&withT)t(b.src,8,'italic',MUT,1);y+=4;}
   });
  });
  var pages=doc.getNumberOfPages();for(var p=2;p<=pages;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text('Kommunikation trifft Resilienz - Dagmar Rostek',M,H-8);doc.text(String(p)+' / '+pages,W-M,H-8,{align:'right'});}
  var file='Playbook-KommunikationResilienz'+(name?'-'+name.replace(/[^A-Za-z0-9À-ɏ]+/g,'-'):'')+'.pdf';
  doc.save(file);
 }).catch(function(){window.print();}).then(function(){btn.disabled=false;btn.textContent='PDF herunterladen';});
}

function go(i){if(i<0||i>=CH.length)return;state.step=i;persist(true);render();window.scrollTo(0,0);}
document.getElementById('prev').addEventListener('click',function(){go(state.step-1);});
document.getElementById('next').addEventListener('click',function(){go(state.step+1);});
document.getElementById('progress').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(+b.getAttribute('data-go'));});
var calcTimer=null;
main.addEventListener('input',function(e){var el=e.target,k=el.getAttribute('data-key');if(!k)return;
 var v=el.value;if(el.getAttribute('data-num')){v=v===''?'':+v;}state.f[k]=v;
 var o=main.querySelector('[data-out="'+k+'"]');if(o){var flds=[];CH.forEach(function(c){c.blocks.forEach(function(b){if(b.fields)b.fields.forEach(function(f){if(f.id===k)flds.push(f);});});});o.textContent=v+(flds[0]&&flds[0].u?flds[0].u:'');}
 persist();clearTimeout(calcTimer);calcTimer=setTimeout(updateCalcs,120);});
main.addEventListener('change',function(e){var el=e.target;if(el.tagName==='SELECT'){var k=el.getAttribute('data-key');if(k){state.f[k]=el.getAttribute('data-num')?(el.value===''?'':+el.value):el.value;persist();updateCalcs();}return;}
 var id=el.getAttribute('data-photo');if(!id)return;var files=[].slice.call(el.files||[]);el.value='';if(!files.length)return;toast('Foto wird gespeichert …');
 DB.get(id).then(function(list){return Promise.all(files.map(compress)).then(function(add){return DB.set(id,list.concat(add));});}).then(function(){toast('Foto gespeichert');loadThumbs(id);}).catch(function(){toast('Foto konnte nicht gespeichert werden');});});
main.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){go(+g.getAttribute('data-go'));return;}
 var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-dict'))return toggleDictate(t);
 var scEl=t.parentNode&&t.parentNode.getAttribute&&t.parentNode.getAttribute('data-sc');
 if(scEl&&t.hasAttribute('data-v')){var v=+t.getAttribute('data-v');if(state.f[scEl]===v){delete state.f[scEl];}else state.f[scEl]=v;
  var bs=t.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',state.f[scEl]===+bs[i].getAttribute('data-v'));persist();updateCalcs();return;}
 if(t.hasAttribute('data-chip')){var cid=t.getAttribute('data-chip'),wd=t.getAttribute('data-w');var a=(state.f[cid]||[]).slice();var ix=a.indexOf(wd);if(ix>-1)a.splice(ix,1);else a.push(wd);state.f[cid]=a;t.classList.toggle('on');persist();return;}
 if(t.hasAttribute('data-del')){var pid=t.getAttribute('data-del'),pi=+t.getAttribute('data-i');DB.get(pid).then(function(l){l.splice(pi,1);return DB.set(pid,l);}).then(function(){loadThumbs(pid);toast('Foto entfernt');});return;}
 if(t.id==='pdf'){var cb=document.getElementById('withTheory');state.theory=!!(cb&&cb.checked);persist(true);return makePDF(t);}
 if(t.id==='reset'){document.getElementById('confirm').hidden=false;return;}
 if(t.id==='reset-no'){document.getElementById('confirm').hidden=true;return;}
 if(t.id==='reset-yes'){state={step:0,f:{},theory:true};try{localStorage.removeItem(KEY);}catch(err){}DB.clear().then(function(){render();window.scrollTo(0,0);toast('Alles gelöscht');});}
});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight')go(state.step+1);if(e.key==='ArrowLeft')go(state.step-1);});
if(state.step>=CH.length)state.step=0;
render();
})();
</script>
