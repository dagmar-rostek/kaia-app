<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moderation Leadership-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: facilitator console for a projector. */
:root{
  --paper:#F4F5F2; --card:#FFFFFF; --ink:#18201C; --muted:#56615A; --line:#D9DED8; --soft:#ECEFEA;
  --now:#18201C; --now-ink:#F4F5F2;
  --res:#3E6B4F; --res-soft:#E3ECE4;
  --team:#2F5F8A; --team-soft:#E1EAF3;
  --werte:#86561C; --werte-soft:#F2E7D6;
  --konf:#8A3B52; --konf-soft:#F2E2E7;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --card:#1A1F1C; --ink:#E7ECE7; --muted:#A2ADA5; --line:#2C3530; --soft:#202723;
    --now:#E7ECE7; --now-ink:#121614;
    --res:#8FC2A0; --res-soft:#1F2D25; --team:#8DB8E0; --team-soft:#1B2633;
    --werte:#E2B87C; --werte-soft:#2D2417; --konf:#E59DB1; --konf-soft:#2D1B21; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A1F1C; --ink:#E7ECE7; --muted:#A2ADA5; --line:#2C3530; --soft:#202723;
  --now:#E7ECE7; --now-ink:#121614;
  --res:#8FC2A0; --res-soft:#1F2D25; --team:#8DB8E0; --team-soft:#1B2633;
  --werte:#E2B87C; --werte-soft:#2D2417; --konf:#E59DB1; --konf-soft:#2D1B21; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.t-res{--c:var(--res);--cs:var(--res-soft)}.t-team{--c:var(--team);--cs:var(--team-soft)}
.t-werte{--c:var(--werte);--cs:var(--werte-soft)}.t-konf{--c:var(--konf);--cs:var(--konf-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:500;white-space:nowrap}
.bricks{display:inline-flex;gap:4px;align-items:flex-end}
.brick{position:relative;width:16px;height:9px;border-radius:2px;background:var(--c)}
.brick::before,.brick::after{content:"";position:absolute;top:-3px;width:4px;height:3px;border-radius:1px 1px 0 0;background:var(--c)}
.brick::before{left:2px}.brick::after{right:2px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:15px}
.tab[aria-current="page"]{background:var(--now);color:var(--now-ink);border-color:var(--now)}
.tab-link{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:15px;text-decoration:none;color:var(--muted);display:inline-flex;align-items:center}
.tab-link:hover{color:var(--ink);border-color:var(--ink)}
.status{margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0}
.status-text{font-size:15px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-text b{color:var(--ink);font-weight:600}
.clock{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.live.on{border-color:var(--ink)}
.live.on .dot{background:#C2412D;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:760px){.status-text{display:none}.clock{font-size:20px}}
.wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:0;min-height:calc(100% - 60px)}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
.rail{border-right:1px solid var(--line);padding:18px 0 40px;padding-left:max(16px,env(safe-area-inset-left,0px))}
@media (max-width:980px){.rail{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));max-height:260px;overflow-y:auto}}
.rail h2{margin:0 16px 10px 0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.agenda{list-style:none;margin:0;padding:0 12px 0 0;display:flex;flex-direction:column;gap:2px}
.ag{width:100%;text-align:left;border:0;background:none;cursor:pointer;border-radius:10px;padding:7px 10px;display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:baseline;position:relative}
.ag:hover{background:var(--soft)}
.ag .tm{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag .nm{font-size:15px;line-height:1.3}
.ag.k-pause .nm{color:var(--muted);font-style:italic}
.ag.k-check .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink);margin-right:7px;vertical-align:1px}
.ag.k-themen .nm::after{content:"";display:inline-block;margin-left:8px;width:22px;height:6px;vertical-align:2px;border-radius:2px;background:linear-gradient(90deg,var(--res) 0 25%,var(--team) 25% 50%,var(--werte) 50% 75%,var(--konf) 75%)}
.ag.past{opacity:.5}
.ag.sel{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.ag.now{background:var(--now);color:var(--now-ink)}
.ag.now .tm,.ag.now .nm{color:var(--now-ink)}
.ag.now .nm::before{border-color:var(--now-ink)}
.ag .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:1px;background:var(--now-ink);opacity:.5;transform-origin:left;transform:scaleX(var(--p,0))}
.ag .bar{display:none}.ag.now .bar{display:block}
.rail-foot{margin:16px 12px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.rail-foot kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--card)}
.stage{padding:28px 0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media (min-width:981px){.stage{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
.view{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:26px;animation:fade .3s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0;font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.eyebrow .t{color:var(--ink);font-weight:500}
.kind{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.nowtag{font-family:var(--body);font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--now);color:var(--now-ink)}
h1{margin:-14px 0 0;font-family:var(--display);font-weight:300;font-size:clamp(38px,4.6vw,66px);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.goal{margin:0;font-size:clamp(19px,1.7vw,24px);color:var(--muted);max-width:62ch;text-wrap:pretty}
.say{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.say-l{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.say p{margin:0;font-family:var(--display);font-size:clamp(20px,1.8vw,26px);line-height:1.38;font-weight:300}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols2{grid-template-columns:minmax(0,1fr)}}
.panel{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel ul,.panel ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.panel li{text-wrap:pretty}
details.fold{border-top:1px solid var(--line)}
details.fold:last-of-type{border-bottom:1px solid var(--line)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";flex:none;font-size:24px;line-height:1;color:var(--muted);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(45deg)}
.fold-body{padding:0 2px 16px;display:flex;flex-direction:column;gap:8px}
.fold-body ul,.fold-body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.fold-body p{margin:0}
.fold-body blockquote{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--line);font-family:var(--display);font-size:20px;line-height:1.4;font-weight:300}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1250px){.quad{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.quad{grid-template-columns:minmax(0,1fr)}}
.tc{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tc-name{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.tc-open{border:0;background:none;padding:0;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.tc-title{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.12}
.tc-sub{margin:-4px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tc p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--cs);color:var(--ink)}
.tc details.fold{border-color:var(--line)}
.tc details.fold>summary{font-size:15px;padding:10px 0}
.tc .fold-body{font-size:16px}
.tc details.fold:last-of-type{border-bottom:0}
.warn{font-size:15px;padding:8px 12px;border-radius:10px;background:var(--cs)}
.themestrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.themestrip span{font-size:14px;color:var(--muted);margin-right:4px}
.tchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 10px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.tchip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tchip:hover{border-color:var(--c)}
.next{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:16px;background:var(--soft)}
.next-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.next-txt small{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.next-txt b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.next-txt span{font-family:var(--mono);font-size:14px;color:var(--muted)}
.btns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;cursor:pointer;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--now);color:var(--now-ink);border-color:var(--now)}
.next details{flex-basis:100%}
.next details summary{cursor:pointer;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;display:inline-block}
.next details p{margin:10px 0 0;font-family:var(--display);font-size:19px;line-height:1.4;font-weight:300}
.pausebox{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:10px 0}
.count{font-family:var(--mono);font-size:clamp(70px,12vw,170px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.steps div{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.steps div:last-child{border-right:0}
.steps .min{font-family:var(--mono);font-size:13px;color:var(--muted)}
.steps b{font-family:var(--display);font-weight:400;font-size:22px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}.steps div{border-right:0;border-bottom:1px solid var(--line)}}
.th-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:900px){.grid4{grid-template-columns:minmax(0,1fr)}}
.grid4.focus{grid-template-columns:minmax(0,1fr)}
.grid4.focus .tcard:not(.on){display:none}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tcard-top{padding:22px 24px 18px;border-top:8px solid var(--c);display:flex;flex-direction:column;gap:10px}
.tcard-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,2.6vw,38px);line-height:1.05}
.tcard .lq{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(20px,1.7vw,25px);line-height:1.25;color:var(--c)}
.tcard .about{margin:0;color:var(--ink);max-width:60ch}
.fit{margin:0;font-size:16px;color:var(--muted)}
.fit b{color:var(--ink);font-weight:600}
.proc{padding:6px 24px 22px;display:flex;flex-direction:column;gap:16px}
.ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.end{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.end small{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.end span{font-size:16px;line-height:1.3}
.end.a{border:1.5px dashed var(--c)}
.end.a small{color:var(--muted)}
.end.z{background:var(--c);color:var(--card)}
.end.z small{color:var(--card);opacity:.85}
.ends .arr{display:flex;align-items:center;color:var(--c)}
.ends .arr svg{width:46px;height:20px}
.rail-line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.rail-line::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:2px;background:var(--c);opacity:.35}
.rail-line li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;padding:0 4px}
.rail-line .n{width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;font-weight:500;position:relative}
.rail-line li:last-child .n{background:var(--c);color:var(--card)}
.rail-line .l{font-size:14px;line-height:1.25;text-wrap:balance;min-height:2.5em}
.rail-line .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (max-width:520px){
  .ends{grid-template-columns:minmax(0,1fr)}.ends .arr{justify-content:center;transform:rotate(90deg)}
  .rail-line{grid-template-columns:minmax(0,1fr);gap:10px}
  .rail-line::before{left:17px;right:auto;top:18px;bottom:18px;width:2px;height:auto}
  .rail-line li{flex-direction:row;text-align:left;align-items:center}
}
.take{margin:0 24px 18px;padding:16px 18px;border-radius:16px;background:var(--cs);display:flex;flex-direction:column;gap:8px}
.take h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.take ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tcard .folds{padding:0 24px 8px}
.ph-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ph-list li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px}
.ph-list li>b{font-family:var(--display);font-weight:500;color:var(--c);font-size:18px}
.ph-list p{margin:0}
.ph-list .pt{font-weight:600}
.models{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.models li b{font-weight:600}
.intro-themes{display:flex;flex-direction:column;gap:6px}
.sig{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted);line-height:1.6}
.sig b{color:var(--ink);font-weight:600}

/* ── ADMIN GATE ── */
#pb-gate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:32px;text-align:center;font-family:var(--body)}
#pb-gate .g-eye{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#pb-gate .g-title{font-family:var(--display);font-weight:300;font-size:clamp(24px,6vw,38px);margin:0;line-height:1.1;color:var(--ink)}
#pb-gate form{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:280px}
#pb-gate input[type=password]{width:100%;font:inherit;font-size:18px;letter-spacing:.15em;text-align:center;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
#pb-gate input[type=password]:focus{outline:none;border-color:var(--res);box-shadow:0 0 0 3px var(--res-soft)}
#pb-gate .g-btn{width:100%;border:0;border-radius:999px;background:var(--res);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:13px;cursor:pointer}
#pb-gate .g-err{font-size:14px;color:#c2412d;min-height:20px;margin:0}
#pb-gate .g-back{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
#pb-gate .g-hint{font-size:13px;color:var(--muted);margin:0}
#pb-app{display:none}
/* Du-machst: eingeklappt/ausgeklappt */
.dm-fold{border-top:0;border-bottom:0;min-width:0}
.dm-fold>summary{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 2px 10px;font-weight:600}
.dm-fold[open]>summary::after{transform:rotate(45deg)}
/* Enjah-Karte */
.enjah-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.enjah-card img,.enjah-card video{width:100%;max-height:560px;object-fit:cover;display:block}
.enjah-card-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.enjah-card-body b{font-size:14px;font-weight:600}
.enjah-card-body p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>

var SIG='<b>Dagmar Rostek</b> &middot; dagmar@ecoaching-rostek.de &middot; 0176 611 59 403 &middot; rostek-dagmar.de<br>rostek unternehmensKOMMUNIKATION &middot; superVision &middot; coaching<br>KI-Strategie &amp; Organisationsentwicklung';
var KIND={plenum:'Plenum',themen:'Themenarbeit',check:'Zwischenstand',pause:'Pause',tandem:'Tandems'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mins(hm){var p=hm.split(':');return +p[0]*60+ +p[1];}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function liveIndex(){var n=nowMin();for(var i=0;i<B.length;i++){if(n>=mins(B[i].s)&&n<mins(B[i].e))return i;}return n<mins(B[0].s)?-1:B.length;}
function li(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}
function chips(a){return '<div class="chips">'+a.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>';}
function fold(h,body,open){return '<details class="fold"'+(open?' open':'')+'><summary>'+h+'</summary><div class="fold-body">'+body+'</div></details>';}
function themeStrip(){return '<div class="themestrip"><span>Die vier Themen:</span>'+THEMES.map(function(t,i){return '<button class="tchip t-'+t.k+'" type="button" data-theme="'+i+'"><i></i>'+t.name+'</button>';}).join('')+'</div>';}

var view='ablauf', sel=0, live=true, focusTheme=-1;
function parseHash(){var h=location.hash||'';var m=/^#block-(\d+)$/.exec(h);if(m){view='ablauf';sel=Math.min(B.length-1,Math.max(0,+m[1]-1));live=false;return;}
 m=/^#thema-(\d)$/.exec(h);if(m){view='themen';focusTheme=Math.min(3,+m[1]-1);return;}
 if(h==='#themen'){view='themen';focusTheme=-1;return;}}
function setHash(){var h=view==='themen'?(focusTheme>=0?'#thema-'+(focusTheme+1):'#themen'):'#block-'+(sel+1);try{if(location.hash!==h)history.replaceState(null,'',h);}catch(e){}}

function renderAgenda(){
 var cur=liveIndex(), n=nowMin();
 document.getElementById('agenda').innerHTML=B.map(function(b,i){
  var cls='ag k-'+b.k+(i<cur?' past':'')+(i===cur?' now':'')+(view==='ablauf'&&i===sel?' sel':'');
  var p=i===cur?Math.min(1,(n-mins(b.s))/(mins(b.e)-mins(b.s))):0;
  return '<li><button class="'+cls+'" type="button" data-go="'+i+'" style="--p:'+p.toFixed(3)+'"'+(view==='ablauf'&&i===sel?' aria-current="step"':'')+'><span class="tm">'+b.s+'</span><span class="nm">'+esc(b.t)+'</span><span class="bar"></span></button></li>';
 }).join('');
}

function fmtLeft(m){m=Math.max(0,Math.round(m));return m>=60?Math.floor(m/60)+' Std. '+(m%60)+' Min.':m+' Min.';}
function renderStatus(){
 var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 var cur=liveIndex(),n=nowMin(),txt;
 if(cur<0)txt='Start um <b>08:30</b>, noch '+fmtLeft(mins(B[0].s)-n);
 else if(cur>=B.length)txt='<b>Geschafft.</b> Danke f\xfcr den Tag.';
 else{var b=B[cur],nx=B[cur+1];txt='Jetzt: <b>'+esc(b.t)+'</b>, noch '+fmtLeft(mins(b.e)-n)+(nx?' &middot; danach '+esc(nx.t):'');}
 document.getElementById('status-text').innerHTML=txt;
 var lb=document.getElementById('live');lb.classList.toggle('on',live);lb.setAttribute('aria-pressed',live?'true':'false');
 document.getElementById('live-label').textContent=live?'Live':'Live folgen';
 document.getElementById('tab-themen').setAttribute('aria-current',view==='themen'?'page':'false');
 document.getElementById('tab-ablauf').setAttribute('aria-current',view==='ablauf'?'page':'false');
 var pc=document.getElementById('pause-count');
 if(pc){var b2=B[sel];var left=mins(b2.e)*60-(d.getHours()*3600+d.getMinutes()*60+d.getSeconds());var total=(mins(b2.e)-mins(b2.s))*60;if(left>total||left<0)left=total;pc.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');}
}

function themeCol(t,i,b){

 if(b.ph==='kern'){
  h+='<h3 class="tc-title">Mein Kern</h3><p>'+t.kern+'</p>'+fold('Fragen beim Rundgang',li(['Was zieht sich durch deinen Tag?','Welches Foto aus deinem Playbook zeigt das am besten?','Was willst du im Interview erz\xe4hlen?']),false);
  return h+'</article>';
 }
 b.ph.forEach(function(pi,n){
  var p=t.ph[pi];
  if(n>0)h+='<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">';
  h+='<p class="tc-sub">Phase '+(pi+1)+'</p><h3 class="tc-title">'+p.t+'</h3><p>'+p.a+'</p>'+chips(p.m);
  h+=fold('Fragen beim Rundgang',li(p.f),false)+fold('Theorie in zwei S\xe4tzen','<p>'+p.th+'</p>',false);

 });
 if(b.ph[0]===0||b.ph[0]===1)h+=fold('Achte darauf','<p>'+t.warn+'</p>',false);
 return h+'</article>';
}
function renderBlock(){

 var h='<section class="view" aria-labelledby="bt">';
 h+='<p class="eyebrow"><span class="t">'+b.s+'–'+b.e+'</span><span class="kind">'+KIND[b.k]+'</span>'+(isNow?'<span class="nowtag">Jetzt</span>':'')+'</p>';
 h+='<h1 id="bt">'+esc(b.t)+'</h1><p class="goal">'+b.goal+'</p>';
 if(b.k==='pause'){h+='<div class="pausebox"><div class="count" id="pause-count">'+String(mins(b.e)-mins(b.s)).padStart(2,'0')+':00</div></div>';}
 if(b.say)h+='<div class="say"><span class="say-l">So kannst du es sagen</span>'+b.say.map(function(s){return '<p>'+s+'</p>';}).join('')+'</div>';
 if(sel===0)h+='<div class="enjah-card"><img src="/playbooks/enjah.png" alt="Enjah" onerror="this.style.display=\'none\'"><div class="enjah-card-body"><b>Wo ist Enjah?</b><p>Da, sie hat es heute nicht aus dem Bett geschafft, ihr kennt das … und ja in der Pubert\xe4t ist da leider nichts zu machen, wir lassen sie schlafen ….</p></div></div>';
 if(b.steps)h+='<div class="steps">'+b.steps.map(function(s){return '<div><span class="min">'+s[0]+'</span><b>'+s[1]+'</b><span>'+s[2]+'</span></div>';}).join('')+'</div>';
 if(b.k==='themen')h+='<div class="quad">'+THEMES.map(function(t,i){return themeCol(t,i,b);}).join('')+'</div>';
 if(b.do||b.folds){
  h+='<div class="cols2">';
  if(b.do)h+='<details class="fold dm-fold" open><summary>Du machst</summary><div class="fold-body">'+li(b.do)+'</div></details>';
  if(b.folds)h+='<div class="panel"><h3>Zum Aufklappen</h3><div>'+b.folds.map(function(f){return fold(f[0],li(f[1]),false);}).join('')+'</div></div>';
  h+='</div>';
 }
 if(b.themes||b.k!=='themen')h+=themeStrip();
 h+='<div class="next">';
 if(nx){h+='<div class="next-txt"><small>Als N\xe4chstes</small><b>'+esc(nx.t)+'</b><span>'+nx.s+'–'+nx.e+' &middot; '+KIND[nx.k]+'</span></div>';}
 else{h+='<div class="next-txt"><small>Ende</small><b>Danke f\xfcr den Tag</b><span>15:00</span></div>';}
 h+='<div class="btns"><button class="btn" type="button" data-step="-1"'+(sel===0?' disabled':'')+'>Zur\xfcck</button>'+(nx?'<button class="btn primary" type="button" data-step="1">Weiter</button>':'')+'</div>';
 if(nx&&nx.say)h+='<details><summary>\xdcberleitung zum n\xe4chsten Block lesen</summary><p>'+nx.say[0]+'</p></details>';
 h+='</div>';
 h+='<div class="sig">'+SIG+'</div></section>';
 return h;
}

 h+='<ol class="rail-line">'+t.steps.map(function(s,n){return '<li><span class="n">'+(n+1)+'</span><span class="l">'+s+'</span><span class="tm">'+times[n]+'</span></li>';}).join('')+'</ol></div>';

 h+=fold('Theorie im Playbook','<ul class="models">'+t.models.map(function(m){return '<li><b>'+m[0]+':</b> '+m[1]+'</li>';}).join('')+'</ul>',false);

function renderThemes(){
 var h='<section class="view" aria-labelledby="tt"><div class="th-head"><div class="intro-themes"><p class="eyebrow"><span class="t">09:00</span><span class="kind">\xdcberblick</span></p><h1 id="tt">Vier Themen, eines davon <em>ganz</em>.</h1><p class="goal">Jede Person arbeitet den ganzen Tag an einem Thema, in f\xfcnf Phasen vom Anfang bis zum Ziel.</p></div>'+

 h+='<div class="next"><div class="next-txt"><small>Zur\xfcck in den Ablauf</small><b>'+esc(B[sel].t)+'</b><span>'+B[sel].s+'–'+B[sel].e+'</span></div><div class="btns"><button class="btn primary" type="button" id="back-ablauf">Zum Ablauf</button></div></div>';
 h+='<div class="sig">'+SIG+'</div></section>';

var stage=document.getElementById('stage');
function render(scrollTop){
 if(live&&view==='ablauf'){var c=liveIndex();sel=c<0?0:(c>=B.length?B.length-1:c);}
 stage.innerHTML=view==='themen'?renderThemes():renderBlock();
 renderAgenda();renderStatus();setHash();
 if(scrollTop)window.scrollTo(0,0);
}
function go(i){sel=Math.max(0,Math.min(B.length-1,i));view='ablauf';live=false;render(true);}
function showThemes(i){view='themen';focusTheme=(typeof i==='number')?i:-1;render(true);
 if(focusTheme>=0){var el=document.getElementById('thema-'+(focusTheme+1));if(el)el.scrollIntoView({block:'start'});}}

document.getElementById('agenda').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(+b.getAttribute('data-go'));});
document.getElementById('tab-themen').addEventListener('click',function(){showThemes();});
document.getElementById('tab-ablauf').addEventListener('click',function(){view='ablauf';render(true);});
document.getElementById('live').addEventListener('click',function(){live=!live;if(live)view='ablauf';render(true);});
stage.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-step')){go(sel+(+t.getAttribute('data-step')));return;}
 if(t.hasAttribute('data-theme')){showThemes(+t.getAttribute('data-theme'));return;}
 if(t.hasAttribute('data-focus')){var i=+t.getAttribute('data-focus');focusTheme=focusTheme===i?-1:i;render(true);return;}
 if(t.id==='back-ablauf'){view='ablauf';render(true);return;}
 if(t.hasAttribute('data-toggle-all')){var ds=[].slice.call(stage.querySelectorAll('details.fold'));var open=!ds.every(function(d){return d.open;});ds.forEach(function(d){d.open=open;});t.textContent=open?'Alle Details zuklappen':'Alle Details aufklappen';}
});
document.addEventListener('keydown',function(e){
 var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(sel+1);}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(sel-1);}
 else if(e.key==='t'||e.key==='T'){showThemes();}
 else if(e.key==='l'||e.key==='L'){live=true;view='ablauf';render(true);}
 else if(e.key==='f'||e.key==='F'){try{if(document.fullscreenElement)document.exitFullscreen();else{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}}catch(err){}}
});
window.addEventListener('hashchange',function(){parseHash();render(true);});

parseHash();render(false);
var lastLive=liveIndex();
setInterval(function(){
 var c=liveIndex();
 if(c!==lastLive){lastLive=c;if(live&&view==='ablauf'){render(true);return;}renderAgenda();}
 renderStatus();
 var bars=document.querySelectorAll('.ag.now');if(bars.length){var b=B[c];if(b){var p=Math.min(1,(nowMin()-mins(b.s))/(mins(b.e)-mins(b.s)));bars[0].style.setProperty('--p',p.toFixed(3));}}
},1000);
})();

<script>

  var form=document.getElementById('pb-form');
  if(!form)return;
  form.addEventListener('submit',function(e){
    e.preventDefault();

    else{document.getElementById('pb-err').textContent='Falsches Passwort.';document.getElementById('pb-pw').value='';document.getElementById('pb-pw').focus();}
  });
})();
</script>
