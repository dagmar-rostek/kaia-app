<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Playbook Wertearbeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one screen per phase, narrow reading column; depth lives in nested "+" layers; print view renders everything opened */
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --ink:#1C221E; --muted:#56635A; --line:#DCE0DA;
  --accent:#86561C; --accent-soft:#F2E7D6; --accent-ink:#FFFFFF; --danger:#A3412F; --note:#FFF6C9; --note-ink:#3B3418;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --surface:#1A1F1C; --ink:#E7ECE7; --muted:#A3AEA6; --line:#2E3631;
    --accent:#E2B87C; --accent-soft:#2D2417; --accent-ink:#101411; --danger:#E8907E; --note:#3A3520; --note-ink:#F4E9B8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --surface:#1A1F1C; --ink:#E7ECE7; --muted:#A3AEA6; --line:#2E3631;
  --accent:#E2B87C; --accent-soft:#2D2417; --accent-ink:#101411; --danger:#E8907E; --note:#3A3520; --note-ink:#F4E9B8; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#print{display:none}

/* top */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.top-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-size:17px;font-weight:500}
.saved{font-size:13px;color:var(--muted);transition:opacity .4s}
.progress{display:grid;gap:4px}
.seg{height:20px;border:0;padding:0;background:none;cursor:pointer;display:flex;align-items:center}
.seg span{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
.seg.done span{background:var(--accent);opacity:.45}
.seg.now span{background:var(--accent);height:6px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 40px}
.screen{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:26px;animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{margin:0;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1{margin:-16px 0 0;font-family:var(--display);font-weight:300;font-size:clamp(34px,8vw,50px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch;text-wrap:pretty}
.impulse{margin:0;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(23px,5.4vw,30px);line-height:1.28;color:var(--accent);text-wrap:balance}
.label{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.task p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:14px;padding:5px 13px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.ways{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ways li{display:flex;gap:12px;align-items:flex-start}
.ways svg{flex:none;margin-top:3px}
.ico{stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* rich text blocks */
.rt{display:flex;flex-direction:column;gap:14px}
.rt p,.rt ul,.rt ol{margin:0}
.rt ul,.rt ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.rt h4{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.rt strong{font-weight:600}
.rt blockquote{margin:0;padding:4px 0 4px 18px;border-left:2px solid var(--accent);font-family:var(--display);font-style:italic;font-size:19px;line-height:1.4}
.rt blockquote p{margin:0}
.rt cite{display:block;margin-top:6px;font-family:var(--body);font-style:normal;font-size:14px;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ex-l{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ex p{margin:0}
.refl{margin:0;padding:14px 18px;border-radius:14px;background:var(--accent-soft);font-weight:500}
.refl::before{content:"Zum Nachdenken";display:block;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.lit{list-style:none;padding:0!important;font-size:15px;color:var(--muted)}
.lit li{padding-left:18px;position:relative}
.lit li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* figures */
.fig{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center;padding:18px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.fig svg{width:100%;max-width:440px;height:auto;overflow:visible}
.fig figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:52ch}
.g-line{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.g-thin{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
.g-axis{fill:none;stroke:var(--muted);stroke-width:1.2}
.g-f1{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:1.5}
.g-f2{fill:var(--accent);fill-opacity:.24;stroke:var(--accent);stroke-width:1.5}
.g-f3{fill:var(--accent);fill-opacity:.45;stroke:var(--accent);stroke-width:1.5}
.g-solid{fill:var(--accent)}
.g-paper{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.g-t{fill:var(--ink);font-family:var(--body);font-size:13px;font-weight:600}
.g-s{fill:var(--muted);font-family:var(--body);font-size:11px}
.g-e{fill:var(--accent);font-family:var(--display);font-style:italic;font-size:14px}
.g-h{fill:var(--accent);font-family:var(--hand);font-size:19px}

/* layers */
details.more,details.layer,details.model{border-top:1px solid var(--line)}
details.more:last-of-type{border-bottom:1px solid var(--line)}
details.more>summary,details.layer>summary,details.model>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0}
details>summary::-webkit-details-marker{display:none}
details.more>summary::after,details.layer>summary::after,details.model>summary::after{content:"+";flex:none;font-size:24px;line-height:1;color:var(--accent);transition:transform .2s}
details[open].more>summary::after,details[open].layer>summary::after,details[open].model>summary::after{transform:rotate(45deg)}
details.more>summary{font-weight:600}
.more-body{padding-bottom:18px;display:flex;flex-direction:column;gap:16px}
details.layer{margin-left:0}
details.layer>summary{font-weight:500;font-size:16px;padding:12px 0}
details.layer>summary .depth{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto;margin-right:10px;white-space:nowrap}
.layer-body{padding:2px 0 18px 14px;border-left:2px solid var(--accent-soft);display:flex;flex-direction:column;gap:14px}
.layers{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}

/* theory library */
.lib{display:flex;flex-direction:column}
details.model>summary{padding:18px 0;align-items:flex-start}
.m-head{display:flex;gap:14px;align-items:flex-start;min-width:0}
.m-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px}
.m-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.m-t b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.m-t small{font-size:15px;color:var(--muted)}
.model-body{padding:0 0 22px;display:flex;flex-direction:column;gap:16px}
.lib-end{border-top:1px solid var(--line)}
.to-theory{align-self:flex-start}

/* spark */
.spark{position:relative;background:var(--note);color:var(--note-ink);border-radius:4px 18px 4px 18px;padding:20px 22px 18px;transform:rotate(-.6deg);box-shadow:0 1px 0 rgba(0,0,0,.05)}
.spark span{display:block;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.spark p{margin:0;font-family:var(--hand);font-size:27px;line-height:1.15}

/* pause */
.pause{background:var(--accent-soft);border-radius:20px;padding:22px 24px;display:flex;gap:16px;align-items:center}
.pause p{margin:0;font-family:var(--display);font-size:22px;line-height:1.25}
.pause small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:4px}

/* capture */
.capture{display:flex;flex-direction:column;gap:22px;padding-top:4px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.flabel{font-weight:500}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical}
textarea{min-height:110px;line-height:1.5}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumbs:empty{display:none}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:4/3;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 10px;cursor:pointer}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;color:var(--muted);background:var(--surface);font-size:15px}
.photo-btn:hover{border-color:var(--accent);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}

.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps3 li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.steps3 b{font-family:var(--display);font-weight:400;font-size:20px}
.steps3 span{font-size:14px;color:var(--muted);line-height:1.4}
@media (max-width:460px){.steps3{grid-template-columns:minmax(0,1fr)}}

/* cards */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.card .type{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.card .q{font-family:var(--display);font-size:clamp(22px,5.4vw,27px);line-height:1.28;margin:0}
.card-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-nav span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* summary */
.sum{display:flex;flex-direction:column;gap:24px}
.sum-block{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.sum-block h2{margin:0;font-family:var(--display);font-weight:400;font-size:23px}
.sum-item h3{margin:0 0 2px;font-size:14px;font-weight:600;color:var(--muted)}
.sum-item p{margin:0;white-space:pre-wrap}
.empty{color:var(--muted);font-style:italic;margin:0}
.actions{display:flex;flex-direction:column;gap:12px}
.primary{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:15px 22px;cursor:pointer;font-size:17px}
.ghost{border:1px solid var(--line);border-radius:999px;background:transparent;padding:12px 20px;cursor:pointer;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.confirm p{margin:0;flex:1 1 200px}
.danger{border:0;border-radius:999px;background:var(--danger);color:var(--surface);padding:10px 18px;cursor:pointer;font-weight:600}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.howto p{margin:0}

.nav{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.nav button{min-height:46px;border-radius:999px;padding:0 22px;cursor:pointer;font-weight:500}
#prev{border:1px solid var(--line);background:transparent}
#next{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-left:auto}

.sig{font-size:13px;color:var(--muted);line-height:1.6}
.sig b{color:var(--ink);font-weight:600}
footer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
footer .sig{max-width:680px;margin:0 auto}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@page{size:A4;margin:16mm 15mm 16mm}
@media print{
  body{background:#fff;color:#1C221E;font-size:10.5pt;line-height:1.5}
  body::before,.top,main,.nav,footer{display:none!important}
  #print{display:block}
  :root{--bg:#fff;--surface:#fff;--ink:#1C221E;--muted:#55605A;--line:#D5DAD4;--accent:#86561C;--accent-soft:#F2E7D6;--note:#FFF6C9;--note-ink:#3B3418}
  .p-cover{min-height:255mm;display:flex;flex-direction:column;justify-content:space-between;break-after:page}
  .p-cover h1{margin:0;font-size:44pt;line-height:1.02}
  .p-cover .impulse{font-size:18pt;margin-top:10pt}
  .p-name{font-size:14pt;font-weight:600;margin:0}
  .p-sec{break-before:page}
  .p-sec>h2{font-family:var(--display);font-weight:300;font-size:28pt;line-height:1.05;margin:0 0 4pt}
  .p-kicker{font-size:8.5pt;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 4pt}
  .p-sec .impulse{font-size:15pt;margin:6pt 0 10pt}
  .p-sec .lead{margin:0 0 10pt}
  .p-block{margin:0 0 12pt}
  .rt{gap:8pt}
  .fig,.ex,.refl,.spark,.p-entry,.card,.pause{break-inside:avoid}
  .fig{padding:10pt;border-radius:10pt}
  .fig svg{max-width:300pt}
  details>summary::after{display:none!important}
  details>summary{cursor:default}
  details.model>summary{padding:10pt 0 6pt}
  .layer-body{padding-bottom:8pt}
  .spark{transform:none}
  .spark p{font-size:19pt}
  .p-entries{display:flex;flex-direction:column;gap:10pt;margin-top:12pt;padding:12pt 14pt;border:1.2pt solid var(--accent);border-radius:10pt}
  .p-entries>h3{margin:0;font-size:8.5pt;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
  .p-entry h4{margin:0 0 2pt;font-size:9.5pt;color:var(--muted)}
  .p-entry p{margin:0;white-space:pre-wrap}
  .p-blank{height:46pt;border-bottom:1pt solid var(--line);background:repeating-linear-gradient(transparent 0 22pt,var(--line) 22pt 23pt)}
  .p-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8pt}
  .p-photos img{width:100%;border-radius:6pt;break-inside:avoid}
  .p-sig{border-top:1pt solid var(--line);padding-top:8pt;font-size:9pt;color:var(--muted);line-height:1.55}
  .p-sig b{color:var(--ink)}
  .p-end{break-before:page;min-height:240mm;display:flex;flex-direction:column;justify-content:center;gap:18pt}
  .p-end p.big{font-family:var(--display);font-weight:300;font-size:30pt;line-height:1.1;margin:0}
  .chip{border:1pt solid var(--line)}
  .tbl{overflow:visible}
  a{color:inherit;text-decoration:none}
}

/* ── PASSWORD GATE ── */
#pb-gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:32px;text-align:center;font-family:var(--body)}
#pb-gate .g-eye{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#pb-gate .g-title{font-family:var(--display);font-weight:300;font-size:clamp(24px,6vw,38px);margin:0;line-height:1.1;letter-spacing:-.01em}
#pb-gate form{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:280px}
#pb-gate input[type=password]{width:100%;font:inherit;font-size:18px;letter-spacing:.15em;text-align:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
#pb-gate input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#pb-gate .g-btn{width:100%;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:16px;padding:13px;cursor:pointer}
#pb-gate .g-err{font-size:14px;color:var(--danger);min-height:20px;margin:0}
#pb-gate .g-back{font-size:13px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;padding:0;display:block}
#pb-gate .g-hint{font-size:13px;color:var(--muted);margin:0}

/* ── NAVIGATION BAR + SESSION WARNING ── */
.pb-minbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px}
.pb-minbar .pb-back{font:inherit;font-size:13px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pb-minbar .pb-back:hover{color:var(--ink);border-color:var(--accent)}
.pb-minbar .pb-pdf{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:5px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.top{top:calc(env(safe-area-inset-top,0px) + 42px)!important}
.pb-session-warn{padding:9px max(16px,env(safe-area-inset-left,0px));font-size:13px;line-height:1.5;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}

theory:[
{title:`Das Werte- und Entwicklungsquadrat`,sub:`Werte in Balance. Friedemann Schulz von Thun`,fig:`quadrat`,cap:`Jeder Wert braucht einen Schwesterwert.`,
 core:[[`p`,`Der Kommunikationspsychologe Friedemann Schulz von Thun hat eine Idee des Philosophen Paul Helwig weiterentwickelt: Jeder Wert braucht einen <strong>Schwesterwert</strong>, der ihn im Gleichgewicht hält. Fehlt dieses Gegengewicht, kippt der Wert in seine <strong>Übertreibung</strong>. Aus Fürsorge wird Aufopferung, aus Konsequenz wird Härte.`],[`p`,`Die gestrichelten Diagonalen zeigen die <strong>Entwicklungsrichtung</strong>: Wer zur Aufopferung neigt, entwickelt sich nicht zur Härte, sondern hin zur Konsequenz.`]],
 layers:[
  {t:`Wertequadrate aus dem Leitungsalltag`,d:`Beispiele`,b:[[`table`,[`Wert`,`Schwesterwert`,`Übertreibung 1`,`Übertreibung 2`],[[`Fürsorge`,`Konsequenz`,`Aufopferung`,`Härte`],[`Verlässlichkeit`,`Flexibilität`,`Starrheit`,`Beliebigkeit`],[`Nähe`,`Distanz`,`Distanzlosigkeit`,`Kälte`],[`Offenheit`,`Diskretion`,`Indiskretion`,`Verschlossenheit`],[`Gerechtigkeit`,`Barmherzigkeit`,`Paragrafenreiterei`,`Willkür`],[`Ehrgeiz`,`Gelassenheit`,`Verbissenheit`,`Gleichgültigkeit`]]]]},
  {t:`Das Quadrat als Spiegel`,d:`Vertiefung`,b:[[`p`,`Oft ärgern wir uns besonders über Menschen, die unseren Schwesterwert leben, nur übertrieben. Die sehr fürsorgliche Leitung hält die konsequente Kollegin vielleicht für hart. Dabei zeigt diese Kollegin genau die Richtung, in die sie selbst wachsen könnte.`],[`q`,`Über wen ärgerst du dich im Team am meisten? Welchen Wert lebt diese Person, vielleicht übertrieben?`],[`spark`,`Die Kollegin, die dich am meisten nervt, ist manchmal deine beste Lehrerin. Sie weiß es nur nicht.`]]},
  {t:`Selbst ein Quadrat legen`,d:`Anleitung`,b:[[`ol`,[`Schreib einen deiner Kernwerte oben links auf.`,`Frag: Was wird daraus, wenn ich es übertreibe? Das kommt unten links hin.`,`Frag: Was ist das positive Gegenstück zu dieser Übertreibung? Das ist der Schwesterwert, oben rechts.`,`Frag: Was wird aus dem Schwesterwert, wenn man ihn übertreibt? Das kommt unten rechts hin.`,`Prüfe: In welche Richtung musst du dich entwickeln?`]]]},
  {t:`Zum Weiterlesen`,b:[[`lit`,[`Schulz von Thun, F. (1989): Miteinander reden 2. Stile, Werte und Persönlichkeitsentwicklung. Reinbek: Rowohlt.`]]]}
 ]},
{title:`Werte, Normen, Bedürfnisse`,sub:`Was unter der Oberfläche liegt`,fig:`eisberg`,cap:`Sichtbar ist nur das Verhalten.`,
 core:[[`p`,`Werte sind keine Regeln. Sie beschreiben, was uns wichtig ist und woran wir uns orientieren. <strong>Normen</strong> sind die Regeln und Erwartungen, die daraus entstehen, ausgesprochen oder unausgesprochen. Unter den Werten liegen oft <strong>Bedürfnisse</strong>: nach Sicherheit, Anerkennung, Zugehörigkeit oder Selbstbestimmung.`],[`p`,`Im Alltag sehen wir nur das Verhalten. Was darunter liegt, erschließt sich erst im Gespräch, oder in einem Modell.`]],
 layers:[
  {t:`Wenn Werte und Normen auseinandergehen`,d:`Vertiefung`,b:[[`p`,`Spannend wird es dort, wo die eigenen Werte und die Normen der Organisation nicht zusammenpassen. Die Leitung, der Zuwendung wichtig ist, soll Liegezeiten verkürzen. Die Leitung, der Gerechtigkeit wichtig ist, muss einen Dienstplan mit zu wenig Personal verteilen.`],[`ex`,`Aus der Pflege`,`Die Norm sagt: Die Übergabe dauert 15 Minuten. Der Wert sagt: Jede Patientin verdient, dass ihre Geschichte erzählt wird. Beides ist berechtigt.`]]},
  {t:`Werte erkennt man am Ärger`,d:`Praxis`,b:[[`p`,`Oft merkt man erst, wie wichtig ein Wert ist, wenn er verletzt wird. Ärger, Empörung und Unbehagen sind gute Wegweiser zu den eigenen Werten.`],[`q`,`Worüber hast du dich in diesem Jahr am meisten geärgert? Welcher Wert steckt dahinter?`],[`spark`,`Dein Ärger ist ein Detektiv. Er zeigt dir, was dir heilig ist.`]]},
  {t:`Werte sind nicht verhandelbar, Wege schon`,d:`Haltung`,b:[[`p`,`Über Werte lässt sich schlecht streiten. Über die Wege, sie zu leben, sehr gut. Wer in Konflikten von der Werteebene auf die Ebene der konkreten Wege wechselt, findet oft schneller eine Lösung.`]]}
 ]},
{title:`Das Innere Team`,sub:`Viele Stimmen in einer Brust. Friedemann Schulz von Thun`,fig:`team`,cap:`Die Leitung moderiert auch innen.`,
 core:[[`p`,`Schulz von Thun beschreibt, dass in uns verschiedene innere Stimmen sprechen, wie Mitglieder eines Teams. Die Fürsorgliche will helfen, der Pflichtbewusste will Regeln einhalten, die Erschöpfte will nach Hause. Jede Stimme hat ein berechtigtes Anliegen.`],[`p`,`Das <strong>Oberhaupt</strong> ist die Instanz, die diese Stimmen anhört und zu einer stimmigen Entscheidung kommt. Gute innere Führung heißt: alle zu Wort kommen lassen, aber selbst entscheiden.`]],
 layers:[
  {t:`Typische innere Stimmen von Leitungen`,d:`Beispiele`,b:[[`ul`,[`Die Fürsorgliche: „Ich kann die Kollegin jetzt nicht allein lassen.“`,`Der Pflichtbewusste: „Die Dokumentation muss heute fertig sein.“`,`Die Loyale: „Die Pflegedirektion verlässt sich auf mich.“`,`Die Erschöpfte: „Ich kann nicht mehr.“`,`Der Kritiker: „Das hättest du besser machen können.“`,`Die Mutige: „Ich sage jetzt, was ich denke.“`]]]},
  {t:`Eine innere Teamsitzung`,d:`Übung`,b:[[`ol`,[`Nimm eine aktuelle Entscheidung, die dir schwerfällt.`,`Wähle für jede innere Stimme eine Figur.`,`Lass jede Stimme einen Satz sagen.`,`Wer ist laut, wer leise? Wer fehlt?`,`Was entscheidest du als Oberhaupt?`]],[`spark`,`Die leiseste Stimme in deinem Inneren Team hat oft die wichtigste Meldung.`]]},
  {t:`Zum Weiterlesen`,b:[[`lit`,[`Schulz von Thun, F. (1998): Miteinander reden 3. Das Innere Team und situationsgerechte Kommunikation. Reinbek: Rowohlt.`]]]}
 ]},
{title:`Vier ethische Prinzipien`,sub:`Orientierung im Gesundheitswesen. Beauchamp und Childress`,fig:`prinzipien`,cap:`Vier Prinzipien, die sich manchmal widersprechen.`,
 core:[[`p`,`Die Medizinethiker Tom Beauchamp und James Childress haben vier Prinzipien formuliert, die weltweit in der Medizin- und Pflegeethik genutzt werden.`],[`table`,[`Prinzip`,`Bedeutung`],[[`Autonomie`,`Den Willen und die Selbstbestimmung des Menschen respektieren.`],[`Nichtschaden`,`Schaden vermeiden.`],[`Fürsorge`,`Das Wohl des Menschen fördern.`],[`Gerechtigkeit`,`Fair verteilen, gleich behandeln.`]]]],
 layers:[
  {t:`Wenn Prinzipien kollidieren`,d:`Vertiefung`,b:[[`p`,`Die Prinzipien geben keine fertigen Antworten. Ihr Wert liegt darin, Konflikte sichtbar zu machen.`],[`ex`,`Aus der Pflege`,`Ein Patient lehnt die Mobilisation ab (Autonomie), obwohl Liegen ihm schadet (Nichtschaden). Für dein Team als Leitung kommt Gerechtigkeit dazu: Wie viel Zeit darf ein Patient binden, wenn zehn andere warten?`]]},
  {t:`Der ICN-Ethikkodex`,d:`Hintergrund`,b:[[`p`,`Der International Council of Nurses beschreibt in seinem Ethikkodex vier grundlegende Verantwortungsbereiche der Pflege: Gesundheit fördern, Krankheit verhüten, Gesundheit wiederherstellen und Leiden lindern. Er ist eine gute Grundlage, um über die Werte der eigenen Station zu sprechen.`]]},
  {t:`Zum Weiterlesen`,b:[[`lit`,[`Beauchamp, T. L., Childress, J. F. (2019): Principles of Biomedical Ethics. 8. Aufl. Oxford: Oxford University Press.`,`International Council of Nurses (2021): Der ICN-Ethikkodex für Pflegefachpersonen. Deutsche Übersetzung des DBfK.`]]]}
 ]},
{title:`Moralischer Stress`,sub:`Wenn ich weiß, was richtig wäre`,fig:`moral`,cap:`Die Spannung zwischen Wissen und Können.`,
 core:[[`p`,`Der Philosoph Andrew Jameton beschrieb 1984 erstmals eine Belastung, die er bei Pflegekräften beobachtete: <strong>moralischen Stress</strong>. Er entsteht, wenn jemand weiß, was ethisch richtig wäre, es aber aufgrund äußerer Umstände nicht tun kann. Zum Beispiel, weil die Zeit fehlt, das Personal oder die Befugnis.`],[`p`,`Moralischer Stress gilt als einer der Gründe, warum Pflegende den Beruf verlassen. Für Leitungen ist er doppelt relevant: Sie erleben ihn selbst und tragen Verantwortung dafür, wie ihr Team damit umgeht.`]],
 layers:[
  {t:`Woran man moralischen Stress erkennt`,d:`Praxis`,b:[[`ul`,[`Schuldgefühle nach dem Dienst, obwohl man alles gegeben hat.`,`Zynismus: „Ist doch eh egal.“`,`Innerer Rückzug von Patientinnen und Kolleginnen.`,`Wiederkehrende Gedanken an eine bestimmte Situation.`]],[`spark`,`Zynismus ist oft enttäuschter Idealismus im Schutzanzug.`]]},
  {t:`Was hilft`,d:`Praxis`,b:[[`ul`,[`Darüber sprechen dürfen, zum Beispiel in ethischen Fallbesprechungen oder Supervision.`,`Benennen, was nicht in der eigenen Macht liegt.`,`Strukturelle Probleme nach oben tragen, statt sie still zu kompensieren.`,`Kleine Handlungsspielräume nutzen: Was kann ich trotz allem tun?`]],[`q`,`Welche Situation aus deinem Alltag fällt dir beim Lesen ein?`]]},
  {t:`Zum Weiterlesen`,b:[[`lit`,[`Jameton, A. (1984): Nursing Practice. The Ethical Issues. Englewood Cliffs: Prentice-Hall.`,`Riedel, A., Lehmeyer, S. (Hrsg.) (2022): Ethik im Gesundheitswesen. Berlin: Springer.`]]]}
 ]}
],

 {t:'Zirkuläre Fragen',s:'durch fremde Augen schauen',b:[['p','Sie holen die Perspektive anderer ins Gespräch, ohne dass diese anwesend sind. Das öffnet oft mehr als jede direkte Frage.'],['ul',['Was würde dein Team sagen, wenn es dein Modell sähe?','Wer wäre am meisten überrascht, wenn du das umsetzt?','Woran würde deine beste Kollegin merken, dass sich etwas verändert hat?','Wie würde die Pflegedirektion dieses Modell beschreiben?']]]},

 {t:'Ausnahmefragen',s:'wann das Problem kleiner war',b:[['p','Kein Problem ist immer gleich groß. Ausnahmen zeigen, was schon funktioniert.'],['ul',['Wann war es schon einmal leichter?','Was hast du da anders gemacht?','Wer war damals dabei?']]]},

function capture(fs,label){return fs.length?'<section class="capture">'+(label?'<h2 class="label">'+label+'</h2>':'')+fs.map(fieldHTML).join('')+'</section>':'';}

var cardIdx=0;
function cardsHTML(){var q=QCARDS[cardIdx];return'<section class="cards" aria-label="Fragenkarten"><h2 class="label">Fragenkarten</h2><div class="card"><span class="type">'+q[0]+'</span><p class="q">'+q[1]+'</p><div class="card-nav"><button class="mini" type="button" data-card="-1">Vorherige</button><span>'+(cardIdx+1)+' / '+QCARDS.length+'</span><button class="mini" type="button" data-card="1">Nächste</button></div></div></section>';}

/* ---------- phase content (shared by screen and print) ---------- */
function phaseBody(p,open){var h='';
 if(p.lead)h+='<p class="lead">'+p.lead+'</p>';
 if(p.fig)h+=fig(p.fig,p.cap);
 if(p.blocks)h+=blocks(p.blocks,open);
 if(p.impulse)h+='<p class="impulse">'+p.impulse+'</p>';
 if(p.task){h+='<section class="task"><h2 class="label">Bauauftrag</h2><p>'+p.task+'</p>'+(p.materials&&p.materials.length?'<div class="chips">'+p.materials.map(function(m){return'<span class="chip">'+m+'</span>';}).join('')+'</div>':'')+'</section>';}
 if(p.ways)h+='<section><h2 class="label">Wie ihr arbeiten könnt</h2><ul class="ways">'+WAYS.map(function(w){return'<li>'+w[0]+'<span>'+w[1]+'</span></li>';}).join('')+'</ul></section>';
 if(p.spark)h+=spark(p.spark);
 if(p.more&&p.more.length)h+='<details class="more"'+(open?' open':'')+'><summary>Mehr Impulse</summary><div class="more-body">'+layers(p.more,open)+'</div></details>';
 return h;}

/* ---------- render ---------- */
function renderProgress(){var pr=document.getElementById('progress');pr.style.gridTemplateColumns='repeat('+SCREENS.length+',minmax(0,1fr))';
 pr.innerHTML=SCREENS.map(function(s,i){return'<button class="seg '+(i===state.step?'now':(i<state.step?'done':''))+'" type="button" data-go="'+i+'" aria-label="'+esc(s.short)+'"'+(i===state.step?' aria-current="step"':'')+'><span></span></button>';}).join('');}
function render(){stopDictate();var s=SCREENS[state.step],h='<article class="screen">';
 if(s.type==='start'){
  h+='<p class="kicker">Willkommen</p><h1>'+PB.title+'</h1><p class="impulse">'+PB.tagline+'</p>';
  h+='<p class="lead">Dagmar führt durch die Phasen. Hier findest du Impulse, Theorie, Bauaufträge und Platz für deine Gedanken. Alles mit einem + lässt sich aufklappen. Je tiefer du klickst, desto tiefer wird es. Was du einträgst, bleibt auf diesem Gerät.</p>';
  h+='<ol class="steps3"><li><b>Lesen</b><span>Impuls und Bauauftrag. Theorie, so viel du magst.</span></li><li><b>Bauen</b><span>Mit den Materialien im Raum, allein oder zu dritt.</span></li><li><b>Festhalten</b><span>Foto und ein paar Gedanken.</span></li></ol>';
  h+='<p class="hint">Tipp: Statt zu tippen kannst du das Mikrofon auf deiner Handytastatur nutzen.</p>';
  if(PB.startSpark)h+=spark(PB.startSpark);
  h+=capture(F_START);
 } else if(s.type==='theory'){
  h+='<p class="kicker">Theoriebibliothek</p><h1>Zum Nachlesen</h1><p class="lead">'+PB.theoryLead+'</p>'+theoryLib(false);
  if(PB.theorySpark)h+=spark(PB.theorySpark);
  h+=capture(F_THEORY);
 } else if(s.type==='phase'){
  var p=s.p;h+='<p class="kicker">'+p.kicker+'</p><h1>'+p.title+'</h1>'+phaseBody(p,false);
  if(p.toTheory)h+='<button class="mini to-theory" type="button" data-go="1">Zur Theoriebibliothek</button>';
  if(p.build)h+='<div class="pause">'+ICON.hands+'<p>'+(typeof p.build==='string'?p.build:'Jetzt Handy weg und bauen.')+'<small>Danach hältst du hier fest, was entstanden ist.</small></p></div>';
  h+=capture(p.fields||[],p.build?'Festhalten':'');
 } else if(s.type==='kern'){
  h+='<p class="kicker">Mein Kern</p><h1>Das nehme ich mit</h1><p class="lead">Blättere noch einmal durch deine Einträge. Was zieht sich durch deinen Tag wie ein roter Faden?</p>'+fig('kompass2','Aus vielen Modellen wird ein Satz.');
  if(PB.kernSpark)h+=spark(PB.kernSpark);
  h+=capture(F_KERN);
 } else if(s.type==='interview'){
  h+='<p class="kicker">Im Gespräch</p><h1>Lass dich fragen</h1><p class="lead">Ihr interviewt euch zu zweit, mit jemandem aus einem anderen Thema. Bereite vor, was du erzählen möchtest. Die Fragenkarten und die Fragenbibliothek helfen dir, wenn du fragst.</p>'+fig('interview','So läuft das Interview ab.')+cardsHTML();
  h+='<section><h2 class="label">Fragenbibliothek</h2>'+fig('compass','Neun Richtungen, aus denen du auf ein Modell schauen kannst.')+qLib(false)+'</section>';
  h+=capture(F_INT);
 } else {
  h+='<p class="kicker">Abschluss</p><h1>Dein Playbook</h1><p class="lead">Hier siehst du deine Einträge auf einen Blick. Speichere das Playbook als PDF, bevor du gehst. Das PDF enthält alle Inhalte vollständig aufgeklappt, mit allen Grafiken, deinen Texten und Fotos.</p>';
  h+='<div class="actions"><button class="primary" type="button" id="pdf">PDF erstellen</button><div class="howto"><p><b>So geht es:</b> Im Druckfenster als Ziel „Als PDF speichern“ wählen.</p><p>Am iPhone: im Druckfenster auf Teilen tippen und „In Dateien sichern“ wählen.</p></div>'+
   '<button class="ghost" type="button" id="reset">Alle Einträge löschen</button><div class="confirm" id="confirm" hidden><p>Alle Texte und Fotos auf diesem Gerät löschen?</p><button class="danger" type="button" id="reset-yes">Ja, löschen</button><button class="mini" type="button" id="reset-no">Abbrechen</button></div></div>';
  h+='<p class="hint">Deine Einträge liegen nur in diesem Browser auf diesem Gerät. Niemand sonst kann sie sehen.</p><div class="sum" id="sum"></div>';
 }
 h+='</article>';main.innerHTML=h;renderProgress();
 document.getElementById('prev').hidden=state.step===0;
 var nx=document.getElementById('next');nx.hidden=state.step===SCREENS.length-1;nx.textContent=state.step===SCREENS.length-2?'Zum Abschluss':'Weiter';
 fieldsOf(s).forEach(function(f){if(f.type==='photo')loadThumbs(f.id);});
 if(s.type==='end')renderSummary();}
function loadThumbs(id){DB.get(id).then(function(l){PHOTOS[id]=l;var el=document.getElementById('t-'+id);if(!el)return;el.innerHTML=l.map(function(ph,i){return'<div class="thumb"><img src="'+ph.src+'" alt="Foto '+(i+1)+'"><button type="button" data-del="'+id+'" data-i="'+i+'">Entfernen</button></div>';}).join('');});}
function renderSummary(){var h='';SCREENS.forEach(function(s){var fs=fieldsOf(s);if(!fs.length)return;var inner='';fs.forEach(function(f){if(f.id==='name')return;if(f.type==='photo'){var l=PHOTOS[f.id]||[];if(l.length)inner+='<div class="sum-item"><h3>'+esc(f.label)+'</h3><div class="thumbs">'+l.map(function(ph){return'<div class="thumb"><img src="'+ph.src+'" alt=""></div>';}).join('')+'</div></div>';}else{var v=(state.fields[f.id]||'').trim();if(v)inner+='<div class="sum-item"><h3>'+esc(f.label)+'</h3><p>'+esc(v)+'</p></div>';}});
 var title=s.type==='phase'?s.p.title:({start:'Ankommen',theory:'Theorie',kern:'Mein Kern',interview:'Im Gespräch'})[s.type];h+='<section class="sum-block"><h2>'+title+'</h2>'+(inner||'<p class="empty">Noch nichts eingetragen.</p>')+'</section>';});document.getElementById('sum').innerHTML=h;}

/* ---------- print document ---------- */
function pEntries(fs){if(!fs.length)return'';return'<div class="p-entries"><h3>Meine Notizen</h3>'+fs.map(function(f){if(f.id==='name')return'';if(f.type==='photo'){var l=PHOTOS[f.id]||[];return'<div class="p-entry"><h4>'+esc(f.label)+'</h4>'+(l.length?'<div class="p-photos">'+l.map(function(ph){return'<img src="'+ph.src+'" alt="">';}).join('')+'</div>':'<div class="p-blank"></div>')+'</div>';}var v=(state.fields[f.id]||'').trim();return'<div class="p-entry"><h4>'+esc(f.label)+'</h4>'+(v?'<p>'+esc(v)+'</p>':'<div class="p-blank"></div>')+'</div>';}).join('')+'</div>';}
function buildPrint(){var name=(state.fields.name||'').trim(),date=new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});
 var h='<section class="p-cover"><div><p class="p-kicker">Mein Playbook · LEGO® Serious Play® Workshop</p><h1>'+PB.title+'</h1><p class="impulse">'+PB.tagline+'</p></div>'+fig(PB.coverFig||'kompass2','')+'<div>'+(name?'<p class="p-name">'+esc(name)+'</p>':'')+'<p class="lead">'+date+'</p></div><div class="p-sig">'+SIG+'</div></section>';
 h+='<section class="p-sec"><p class="p-kicker">Ankommen</p><h2>Meine Frage für heute</h2>'+pEntries(F_START)+'</section>';
 h+='<section class="p-sec"><p class="p-kicker">Theoriebibliothek</p><h2>Zum Nachlesen</h2><p class="lead">'+PB.theoryLead+'</p>'+theoryLib(true)+(PB.theorySpark?spark(PB.theorySpark):'')+pEntries(F_THEORY)+'</section>';
 PB.phases.forEach(function(p){h+='<section class="p-sec"><p class="p-kicker">'+p.kicker+'</p><h2>'+p.title+'</h2>'+phaseBody(p,true)+pEntries(p.fields||[])+'</section>';});
 h+='<section class="p-sec"><p class="p-kicker">Mein Kern</p><h2>Das nehme ich mit</h2>'+fig('kompass2','')+(PB.kernSpark?spark(PB.kernSpark):'')+pEntries(F_KERN)+'</section>';
 h+='<section class="p-sec"><p class="p-kicker">Im Gespräch</p><h2>Lass dich fragen</h2>'+fig('interview','')+fig('compass','')+qLib(true)+((PB.questions&&PB.questions.length)?'<div class="ex"><span class="ex-l">Fragen zu deinem Thema</span><p>'+PB.questions.join('<br>')+'</p></div>':'')+pEntries(F_INT)+'</section>';
 h+='<section class="p-end"><p class="big">'+(PB.endLine||'Danke für einen Tag mit den Händen im Denken.')+'</p>'+spark(PB.endSpark||'Wer etwas gebaut hat, kann es auch umbauen.')+'<div class="p-sig">'+SIG+'</div></section>';
 document.getElementById('print').innerHTML=h;}
window.addEventListener('beforeprint',buildPrint);

/* ---------- dictation ---------- */
var rec=null,recBtn=null;
function stopDictate(){if(rec){try{rec.stop();}catch(e){}}}
function toggleDictate(btn){if(rec){stopDictate();return;}var ta=document.getElementById(btn.getAttribute('data-dictate'));if(!ta)return;try{rec=new SR();}catch(e){return;}
 recBtn=btn;rec.lang='de-DE';rec.continuous=true;rec.interimResults=false;
 rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){var t=e.results[i][0].transcript.trim();if(!t)continue;ta.value=ta.value?(ta.value.replace(/\s+$/,'')+' '+t):t;ta.dispatchEvent(new Event('input',{bubbles:true}));}}};
 rec.onend=function(){if(recBtn){recBtn.classList.remove('on');recBtn.textContent='Diktieren';}rec=null;recBtn=null;};rec.onerror=function(){};
 try{rec.start();btn.classList.add('on');btn.textContent='Stopp';}catch(e){rec=null;}}

/* ---------- events ---------- */
function go(i){if(i<0||i>=SCREENS.length)return;state.step=i;persist();render();window.scrollTo(0,0);}
document.getElementById('prev').addEventListener('click',function(){go(state.step-1);});
document.getElementById('next').addEventListener('click',function(){go(state.step+1);});
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(+b.getAttribute('data-go'));});
main.addEventListener('input',function(e){var k=e.target.getAttribute('data-key');if(!k)return;state.fields[k]=e.target.value;persist();});
main.addEventListener('change',function(e){var id=e.target.getAttribute('data-photo');if(!id)return;var files=[].slice.call(e.target.files||[]);e.target.value='';if(!files.length)return;flash('Foto wird gespeichert …');
 DB.get(id).then(function(l){return Promise.all(files.map(compress)).then(function(add){l=l.concat(add);return DB.set(id,l);});}).then(function(){flash('Gespeichert');loadThumbs(id);}).catch(function(){flash('Foto konnte nicht gespeichert werden');});});
main.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-dictate'))return toggleDictate(t);
 if(t.hasAttribute('data-card')){cardIdx=(cardIdx+(+t.getAttribute('data-card'))+QCARDS.length)%QCARDS.length;var c=main.querySelector('.cards');if(c)c.outerHTML=cardsHTML();return;}
 if(t.hasAttribute('data-del')){var id=t.getAttribute('data-del'),i=+t.getAttribute('data-i');DB.get(id).then(function(l){l.splice(i,1);return DB.set(id,l);}).then(function(){loadThumbs(id);flash('Foto entfernt');});return;}
 if(t.id==='pdf'){Promise.all(ALL_PHOTO_IDS.map(function(id){return DB.get(id).then(function(l){PHOTOS[id]=l;});})).then(function(){buildPrint();setTimeout(function(){window.print();},150);});return;}
 if(t.id==='reset'){document.getElementById('confirm').hidden=false;return;}
 if(t.id==='reset-no'){document.getElementById('confirm').hidden=true;return;}
 if(t.id==='reset-yes'){state={step:0,fields:{}};PHOTOS={};try{localStorage.removeItem(KEY);}catch(err){}DB.clear().then(function(){render();window.scrollTo(0,0);flash('Alles gelöscht');});}
});

document.getElementById('brand').textContent=PB.brand;
document.getElementById('sig-foot').innerHTML=SIG;
render();
})();
</script>
</div>
</body>
</html>
